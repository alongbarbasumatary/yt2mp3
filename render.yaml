services:
  - type: web
    name: ytdl-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MY_CHAT_ID
        sync: false
      - key: SESSION_STRING
        sync: false
