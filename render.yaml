services:
  - type: web
    name: yt-dlp-telegram-bot
    runtime: docker
    plan: starter          # change to 'standard' for more RAM/CPU
    healthCheckPath: /
    autoDeploy: true

    # Persistent disk — keeps Telethon session alive across deploys
    disk:
      name: bot-data
      mountPath: /app/session
      sizeGB: 1

    envVars:
      - key: BOT_TOKEN
        sync: false        # set in Render dashboard (secret)
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MY_CHAT_ID
        sync: false
      - key: SESSION_DIR
        value: /app/session
      - key: DOWNLOAD_DIR
        value: /tmp/downloads   # ephemeral — files deleted after send ✅
